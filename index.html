<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>ES Movie Club 촬영 배치도</title>
<!-- home-screen:start -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ES Movie Club" />
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171a1f" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" type="image/png" href="/icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<!-- home-screen:end -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" />
<style>
:root{
  --bg:#edeae3;
  --paper:#ffffff;
  --panel:#f7f5f1;
  --panel-2:#eceae4;
  --line:#d7d3ca;
  --line-soft:#e4e0d8;
  --ink:#191b1f;
  --ink-2:#4c5159;
  --muted:#7e8490;
  --accent:#b46a12;
  --accent-soft:#f5e6cf;
  --accent-ink:#8a4f08;
  --danger:#b3372b;
  --canvas-bg:#dfdcd4;
  --floor:#fbfaf7;
  --grid:#c9c5bb;
  --grid-major:#a9a49a;
  --shadow:0 1px 2px rgba(20,18,14,.06), 0 6px 20px rgba(20,18,14,.07);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --cond:"Barlow Condensed","Noto Sans KR",sans-serif;
  --mono:"Roboto Mono","D2Coding",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1114;
    --paper:#181b20;
    --panel:#16191e;
    --panel-2:#1e222a;
    --line:#2b3039;
    --line-soft:#232830;
    --ink:#e9ecf1;
    --ink-2:#a8b0bd;
    --muted:#6f7886;
    --accent:#f0a93f;
    --accent-soft:#39290f;
    --accent-ink:#f8cf9a;
    --danger:#e0695c;
    --canvas-bg:#0b0d10;
    --floor:#1b1f25;
    --grid:#2c323b;
    --grid-major:#3d4550;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1114; --paper:#181b20; --panel:#16191e; --panel-2:#1e222a;
  --line:#2b3039; --line-soft:#232830; --ink:#e9ecf1; --ink-2:#a8b0bd;
  --muted:#6f7886; --accent:#f0a93f; --accent-soft:#39290f; --accent-ink:#f8cf9a;
  --danger:#e0695c; --canvas-bg:#0b0d10; --floor:#1b1f25; --grid:#2c323b; --grid-major:#3d4550;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px;
  display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.slate{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top,0px));
  background:var(--panel); border-bottom:1px solid var(--line);
}
.mark{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.mark .bars{display:flex;gap:2px;align-items:flex-end;height:18px}
.mark .bars i{display:block;width:3px;background:var(--ink);border-radius:1px}
.mark .bars i:nth-child(odd){background:var(--accent)}
.mark b{font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.mark span{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--cond)}

.tabs{flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--ink-2);white-space:nowrap;font-size:13px;
}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.tab small{font-family:var(--mono);font-size:10px;opacity:.75}
.hbtn{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;min-width:34px;padding:0 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--ink-2);
}
.hbtn:hover{border-color:var(--accent);color:var(--ink)}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn svg{width:16px;height:16px;display:block}
.hbtn b{font-family:var(--mono);font-size:10px;font-weight:600;margin-left:3px}
.hbtn.live{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.code-big{
  font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.22em;text-align:center;
  padding:14px 10px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft);
  color:var(--accent-ink);
}
#joinCode{font-family:var(--mono);font-size:19px;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.hgroup{display:flex;gap:6px;flex:0 0 auto}

/* ---------- main ---------- */
main{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-areas:"tools stage panel";
  grid-template-columns:78px minmax(0,1fr) 304px;
}
.tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 6px;display:flex;flex-direction:column;gap:6px}
.stage{grid-area:stage;position:relative;min-width:0;background:var(--canvas-bg);touch-action:none}
.panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;min-height:0}
.sheet-body{display:flex;flex-direction:column;gap:12px;padding:12px}
.sheet-handle{display:none}

.railhead{font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 4px 2px}
.tool{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 6px;border:1px solid transparent;border-radius:10px;color:var(--ink-2);
}
.tool:hover{background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.tool canvas,.tool svg{width:34px;height:34px;display:block}
.tool b{font-weight:500;font-size:11px;letter-spacing:-.01em}
.tool kbd{font-family:var(--mono);font-size:9px;color:var(--muted);line-height:1}

canvas#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.zoom{
  position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:1px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);
}
.zoom button{width:38px;height:34px;display:grid;place-items:center;color:var(--ink-2);font-family:var(--cond);font-size:14px}
.zoom button+button{border-top:1px solid var(--line-soft)}
.zoom button:hover{background:var(--panel-2);color:var(--ink)}
.hud{
  position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;color:var(--ink-2);
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;box-shadow:var(--shadow);pointer-events:none;
}
.hud span+span{border-left:1px solid var(--line);padding-left:7px}
.hud b{color:var(--accent-ink);font-weight:500}
.hint{
  position:absolute;left:12px;top:12px;max-width:min(300px,60%);
  background:color-mix(in srgb, var(--panel) 92%, transparent);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
  padding:8px 10px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);line-height:1.5;
}
.hint button{float:right;margin-left:8px;color:var(--muted);font-size:14px;line-height:1}

/* ---------- panel cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card>h2{
  margin:0;font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line-soft);font-size:11px;color:var(--ink-2);font-family:var(--mono);
}
.chip i{width:8px;height:8px;border-radius:2px;display:block}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);flex:1 1 0;min-width:0}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:13px;color:var(--ink);
}
textarea{resize:vertical;min-height:58px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{
  padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);
  color:var(--ink-2);font-size:12px;font-family:var(--mono);
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.btn{
  flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
  color:var(--ink-2);font-size:12.5px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn svg{width:14px;height:14px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2);padding:2px 0}
.kv b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.sel-title{display:flex;align-items:center;gap:8px}
.sel-title canvas{width:40px;height:40px;flex:0 0 auto;background:var(--panel-2);border-radius:9px;border:1px solid var(--line-soft)}
.sel-title strong{font-size:15px;display:block}
.sel-title em{font-style:normal;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
details.fold{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0}
details.fold>summary{
  list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;
  font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:15px;font-family:var(--mono)}
details.fold[open]>summary::after{content:"–"}
details.fold>.in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-soft);padding-top:11px}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.empty{font-size:12.5px;color:var(--muted);line-height:1.6}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:6px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}

.ovl{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.ovl-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.ovl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.ovl-head strong{font-size:14px}
.ovl-x{font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.ovl-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ovl-body img{display:block;width:100%;border-radius:8px;border:1px solid var(--line-soft);background:#fff}
.ovl-body textarea{min-height:200px;font-family:var(--mono);font-size:11px;line-height:1.5}
.ovl-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft)}

@media (max-width:880px){
  main{grid-template-areas:"stage" "panel" "tools";grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}
  .tools{
    flex-direction:row;align-items:center;border-right:0;border-top:1px solid var(--line);
    overflow-x:auto;overflow-y:hidden;gap:4px;padding:5px 6px;
    padding-bottom:max(5px, env(safe-area-inset-bottom,0px));
    scrollbar-width:none;
  }
  .tools::-webkit-scrollbar{display:none}
  .tools .railhead{
    display:block;flex:0 0 auto;align-self:stretch;width:1px;min-height:40px;padding:0;
    background:var(--line);font-size:0;letter-spacing:0;margin:0 3px;
  }
  .tools .railhead:first-child{display:none}
  .tool{width:auto;flex:0 0 auto;min-width:60px;min-height:58px;padding:6px 4px 5px;gap:2px}
  .tool canvas,.tool svg{width:32px;height:32px}
  .tool kbd{display:none}
  .tool b{font-size:11.5px}

  /* 패널은 바텀시트: 평소엔 손잡이만 남기고 화면을 도면에 몰아준다 */
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .sheet-handle{
    display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:10px 14px;
    color:var(--ink-2);text-align:left;
  }
  .sheet-handle b{flex:1 1 auto;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet-handle .grip{flex:0 0 auto;width:24px;height:4px;border-radius:2px;background:var(--muted);opacity:.45}
  .sheet-handle .chev{
    flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(-135deg);margin-bottom:-3px;
  }
  body.sheet-open .sheet-handle{border-bottom:1px solid var(--line-soft)}
  body.sheet-open .sheet-handle .chev{transform:rotate(45deg);margin-bottom:3px}
  .sheet-body{display:none;max-height:50vh;overflow:auto;padding:10px;gap:10px}
  body.sheet-open .sheet-body{display:flex}

  .tab{max-width:46vw;overflow:hidden;text-overflow:ellipsis}
  .hbtn{height:38px;min-width:38px}
  .zoom button{width:44px;height:40px}
  .hud{font-size:10.5px;padding:4px 8px;max-width:calc(100% - 24px)}
  .hint{max-width:min(300px,calc(100% - 24px));font-size:12px}
  .mark span{display:none}
}
@media (max-width:520px){
  .mark b{display:none}
  .slate{gap:6px;padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="slate">
  <div class="mark">
    <div class="bars" aria-hidden="true"><i style="height:9px"></i><i style="height:15px"></i><i style="height:11px"></i><i style="height:18px"></i></div>
    <b>촬영 배치도</b><span>ES Movie Club</span>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="장면 목록"></div>
  <div class="hgroup">
    <button class="hbtn" id="addShot" title="장면 추가" aria-label="장면 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="hbtn" id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h9a6 6 0 010 12h-1"/></svg></button>
    <button class="hbtn" id="redo" title="다시하기 (Ctrl+Shift+Z)" aria-label="다시하기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5"/><path d="M20 12h-9a6 6 0 000 12h1"/></svg></button>
    <button class="hbtn" id="roomBtn" title="방 (같이 편집)" aria-label="방">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 004 17.5V19"/><circle cx="10" cy="8" r="3.2"/><path d="M20 19v-1.5a3.5 3.5 0 00-2.6-3.4"/><path d="M15.5 5.2a3.2 3.2 0 010 5.6"/></svg><b id="roomCount"></b>
    </button>
    <button class="hbtn" id="theme" title="라이트/다크 전환" aria-label="테마 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>

<main>
  <nav class="tools" id="tools" aria-label="도구"></nav>

  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="hint" id="hint">
      <button id="hintClose" aria-label="닫기">×</button>
      아래에서 <b>카메라·배우·마이크·조명</b>을 고르고 바닥을 누르면 놓여요. 놓인 것을 다시 누르면 점선 고리가 생기는데, 그 고리를 끌면 <b>방향</b>이 돌아가요.<br />촬영할 곳 사진은 <b>바닥 설정 › 사진 올리기</b>에서 넣습니다.
    </div>
    <div class="hud" id="hud"></div>
    <div class="zoom">
      <button id="zin" title="확대">＋</button>
      <button id="zout" title="축소">－</button>
      <button id="zfit" title="화면에 맞추기">FIT</button>
    </div>
  </div>

  <aside class="panel" id="panel">
    <button class="sheet-handle" id="sheetHandle" aria-expanded="false" aria-controls="panelBody">
      <span class="grip" aria-hidden="true"></span>
      <b id="sheetTitle">샷 · 설정</b>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="sheet-body" id="panelBody"></div>
  </aside>
</main>
<input type="file" id="bgFile" accept="image/*" hidden />
<input type="file" id="jsonFile" accept="application/json,.json" hidden />
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  상수 — 한 칸(CELL)은 월드 좌표 48단위, 실제 거리는 m/칸 설정으로 환산
   * ------------------------------------------------------------------ */
  var CELL = 48;
  var KEY = 'filmset.plan.v2';

  /* ── 방(같이 편집) 설정 ───────────────────────────────────────────
     Supabase 프로젝트 › Settings › API 에서
       Project URL      → SUPA_URL
       anon public 키   → SUPA_KEY
     두 값을 넣으면 방 기능이 켜진다. 비워 두면 앱은 평소대로 혼자 쓴다.
     service_role 키는 절대 넣지 말 것 — 브라우저로 그대로 나간다. */
  var SUPA_URL = '';
  var SUPA_KEY = '';
  var ROOM_KEY = 'filmset.room';

  var TYPES = {
    camera: { ko: '카메라', abbr: 'CAM', color: '#3f8bd6', cone: true  },

  function findItem(id) { var a = items(), i; for (i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

    var st = {

      bg: null, bgOpacity: 0.85, theme: null,
      shots: [{ id: 's1', name: '장면 1 · 거실에서 이야기', note: '두 사람이 마주보고 대화', items: [] }],

    var L = items();
    function put(type, c, r, deg, label, extra) {

      if (extra) for (var k in extra) it[k] = extra[k];
      L.push(it);

    put('actor', 8, 7, 0, '배우1');
    put('actor', 11, 7, 180, '배우2');
    put('camera', 15, 8, 194, '카메라1', { spread: 50, reach: 6 });
    put('light', 13, 3, 128, '조명1', { temp: 3200, spread: 45, reach: 5 });
    put('light', 5, 4, 38, '조명2', { temp: 5600, spread: 90, reach: 5 });
    put('mic', 9, 4, 90, '마이크1', { spread: 90, reach: 3.5 });
    return st;
  }

  /* ------------------------------------------------------------------ *
   *  저장 / 불러오기

  var saveTimer = null;
  function save() {
    roomPush();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { toast('브라우저 저장 공간이 가득 찼습니다. 도면 이미지를 줄이거나 JSON으로 내보내세요.'); }
    }, 350);
  }
  /* 예전 파일에 들어 있던, 지금은 없는 장비는 걸러낸다. */
  function sanitize(st) {
    if (!st || !st.shots) return st;
    st.shots.forEach(function (sh) {
      sh.items = (sh.items || []).filter(function (it) { return it && TYPES[it.type]; });
    });
    return st;
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) return defaultState();
    try {
      var s = JSON.parse(raw);
      if (!s || !s.shots || !s.shots.length) return defaultState();
      s.active = Math.min(s.active || 0, s.shots.length - 1);
      if (typeof s.mpc !== 'number' || !s.mpc) s.mpc = 1;
      state = sanitize(s);
      return s;
    } catch (e) { return defaultState(); }
  }

  function snapshot() { return JSON.stringify({ shots: state.shots, active: state.active }); }
  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 60) undoStack.shift();
    redoStack.length = 0;
    syncHistoryButtons();
  }
  function applySnap(json) {
    var s = JSON.parse(json);
    state.shots = s.shots; state.active = Math.min(s.active, s.shots.length - 1);
    if (!findItem(selId)) selId = null;
    renderTabs(); renderPanel(); draw(); save();
  }
  function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); applySnap(undoStack.pop()); syncHistoryButtons(); }
  function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); applySnap(redoStack.pop()); syncHistoryButtons(); }
  function syncHistoryButtons() {

    $('redo').disabled = !redoStack.length;
  }

  /* ------------------------------------------------------------------ *
   *  DOM 유틸
   * ------------------------------------------------------------------ */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {

  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');

      t.id = 'toast';

  }

  /* ------------------------------------------------------------------ *
   *  아이콘 드로잉 — 화면·팔레트·PNG 내보내기에서 모두 재사용
   * ------------------------------------------------------------------ */
  function rr(g, x, y, w, h, r) {
    if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
    g.beginPath();
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function drawGlyph(g, type, r) {
    var c = TYPES[type].color;
    g.lineJoin = 'round'; g.lineCap = 'round';
    if (type === 'camera') {
      g.fillStyle = c;
      rr(g, -r * 0.95, -r * 0.6, r * 1.5, r * 1.2, r * 0.22); g.fill();
      g.beginPath();
      g.moveTo(r * 0.5, -r * 0.4); g.lineTo(r * 1.05, -r * 0.6);
      g.lineTo(r * 1.05, r * 0.6); g.lineTo(r * 0.5, r * 0.4); g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,.34)';
      g.beginPath(); g.arc(-r * 0.42, 0, r * 0.3, 0, 6.2832); g.fill();
      g.beginPath(); g.arc(r * 0.12, 0, r * 0.3, 0, 6.2832); g.fill();
    } else if (type === 'light') {
      g.fillStyle = c;
      g.beginPath(); g.arc(-r * 0.1, 0, r * 0.62, 0, 6.2832); g.fill();
      rr(g, r * 0.32, -r * 0.7, r * 0.26, r * 1.4, r * 0.09); g.fill();
      g.fillStyle = 'rgba(0,0,0,.3)';
      rr(g, -r * 0.62, -r * 0.18, r * 0.5, r * 0.36, r * 0.1); g.fill();
    } else if (type === 'mic') {
      g.fillStyle = c;
      rr(g, -r * 0.9, -r * 0.26, r * 1.75, r * 0.52, r * 0.26); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = r * 0.1;
      for (var i = 0; i < 3; i++) {
        g.beginPath();
        g.moveTo(r * (0.1 + i * 0.24), -r * 0.16);
        g.lineTo(r * (0.1 + i * 0.24), r * 0.16);
        g.stroke();
      }
    } else if (type === 'actor') {
      g.fillStyle = c;
      g.beginPath(); g.ellipse(-r * 0.16, 0, r * 0.46, r * 0.72, 0, 0, 6.2832); g.fill();
      g.beginPath(); g.arc(r * 0.06, 0, r * 0.44, 0, 6.2832); g.fill();
      g.fillStyle = 'rgba(255,255,255,.75)';
      g.beginPath(); g.moveTo(r * 0.38, -r * 0.13); g.lineTo(r * 0.66, 0); g.lineTo(r * 0.38, r * 0.13); g.closePath(); g.fill();
    }
  }

  function coneColor(it) {
    if (it.type === 'light') return it.temp === 5600 ? '#8fc4ff' : '#ffb75c';
    return TYPES[it.type].color;
  }
  function drawCone(g, it, alpha, k) {
    var kind = TYPES[it.type].cone;
    if (!kind) return;
    var col = coneColor(it), len = (it.reach || 3) * CELL, sp = it.spread || 60;
    g.save();
    g.translate(it.x, it.y); g.rotate(it.a);
    if (sp >= 359) {
      g.fillStyle = rgba(col, 0.1 * alpha);
      g.beginPath(); g.arc(0, 0, len, 0, 6.2832); g.fill();
      g.strokeStyle = rgba(col, 0.4 * alpha); g.lineWidth = 1.2 * k;
      g.setLineDash([6 * k, 5 * k]); g.stroke(); g.setLineDash([]);
    } else {
      var half = sp * Math.PI / 360;
      var grad = g.createRadialGradient(0, 0, CELL * 0.2, 0, 0, len);
      grad.addColorStop(0, rgba(col, 0.42 * alpha));
      grad.addColorStop(1, rgba(col, 0.02 * alpha));
      g.fillStyle = grad;
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, len, -half, half); g.closePath(); g.fill();
      g.strokeStyle = rgba(col, 0.36 * alpha); g.lineWidth = 1.1 * k;
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, len, -half, half); g.closePath(); g.stroke();
    }
    g.restore();
  }
  function drawBody(g, it, alpha, showLabel, k) {
    var r = CELL * 0.4;
    g.save();
    g.globalAlpha = alpha;
    g.save();
    g.translate(it.x, it.y); g.rotate(it.a);
    g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 5 * k; g.shadowOffsetY = 1.5 * k;
    drawGlyph(g, it.type, r);
    g.restore();
    if (showLabel && it.label) {
      var fs = 12 * k;
      g.font = '500 ' + fs + 'px "Noto Sans KR", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      var w = g.measureText(it.label).width + 10 * k, h = fs + 7 * k;
      var ly = it.y + r + h * 0.75;
      g.fillStyle = rgba(TYPES[it.type].color, 0.92);
      rr(g, it.x - w / 2, ly - h / 2, w, h, h / 2); g.fill();
      g.fillStyle = '#fff';
      g.fillText(it.label, it.x, ly + 0.5 * k);
    }
    g.restore();
  }

  /* ------------------------------------------------------------------ *
   *  장면 그리기
   * ------------------------------------------------------------------ */
  var board = $('board'), ctx = board.getContext('2d'), stage = $('stage');
  var dpr = 1, cw = 0, ch = 0;

  function palette() {
    return {
      floor: cssv('--floor'), grid: cssv('--grid'), major: cssv('--grid-major'),
      line: cssv('--line'), ink: cssv('--ink'), muted: cssv('--muted'), accent: cssv('--accent')
    };
  }

  function paintScene(g, pal, opt) {
    var W = worldW(), H = worldH(), k = opt.k;
    g.save();
    g.fillStyle = pal.floor;
    g.shadowColor = 'rgba(0,0,0,.2)'; g.shadowBlur = 18 * k; g.shadowOffsetY = 4 * k;
    g.fillRect(0, 0, W, H);
    g.restore();

    if (bgImg && state.bg) {
      g.save();
      g.beginPath(); g.rect(0, 0, W, H); g.clip();
      var sc = Math.min(W / bgImg.width, H / bgImg.height);
      var iw = bgImg.width * sc, ih = bgImg.height * sc;
      g.globalAlpha = state.bgOpacity;
      g.drawImage(bgImg, (W - iw) / 2, (H - ih) / 2, iw, ih);
      g.restore();
    }

    if (state.grid) {
      g.save();
      g.lineWidth = 1 * k;
      for (var c = 0; c <= state.cols; c++) {
        g.strokeStyle = (c % 5 === 0) ? pal.major : pal.grid;
        g.beginPath(); g.moveTo(c * CELL, 0); g.lineTo(c * CELL, H); g.stroke();
      }
      for (var r = 0; r <= state.rows; r++) {
        g.strokeStyle = (r % 5 === 0) ? pal.major : pal.grid;
        g.beginPath(); g.moveTo(0, r * CELL); g.lineTo(W, r * CELL); g.stroke();
      }
      g.restore();
    }
    g.strokeStyle = pal.major; g.lineWidth = 2 * k;
    g.strokeRect(0, 0, W, H);

    if (opt.ghost) {
      for (var s = 0; s < state.shots.length; s++) {
        if (s === state.active) continue;
        var gi = state.shots[s].items;
        for (var j = 0; j < gi.length; j++) drawBody(g, gi[j], 0.16, false, k);
      }
    }

    var L = opt.items;
    for (var i = 0; i < L.length; i++) drawCone(g, L[i], opt.coneAlpha, k);
    for (var i2 = 0; i2 < L.length; i2++) drawBody(g, L[i2], 1, opt.labels, k);
  }

  function draw() {
    if (!cw || !ch) return;
    var pal = palette(), k = 1 / view.s;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = cssv('--canvas-bg');
    ctx.fillRect(0, 0, cw, ch);
    ctx.save();
    ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.tx, dpr * view.ty);

    paintScene(ctx, pal, {
      k: k, items: items(), labels: state.labels && view.s > 0.42,
      ghost: state.ghost, coneAlpha: 1
    });

    var sel = selected();
    if (sel) {
      var r = CELL * 0.36;
      ctx.save();
      ctx.strokeStyle = pal.accent; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.arc(sel.x, sel.y, r * 1.5, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([5 * k, 4 * k]); ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(sel.x, sel.y, CELL * 0.95, 0, 6.2832); ctx.stroke();
      ctx.restore();
      var hx = sel.x + Math.cos(sel.a) * CELL * 0.95, hy = sel.y + Math.sin(sel.a) * CELL * 0.95;
      ctx.save();
      ctx.fillStyle = pal.accent; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.arc(hx, hy, 9 * k, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    if (measure) {
      var d = Math.hypot(measure.b.x - measure.a.x, measure.b.y - measure.a.y);
      ctx.save();
      ctx.strokeStyle = pal.accent; ctx.lineWidth = 2 * k;
      ctx.setLineDash([7 * k, 5 * k]);

      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(measure.a.x, measure.a.y, 4 * k, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(measure.b.x, measure.b.y, 4 * k, 0, 6.2832); ctx.fill();
      var txt = meters(d).toFixed(2) + ' m';

      ctx.fillStyle = '#fff'; ctx.fillText(txt, mx, my);

  }

  function meters(worldDist) { return worldDist / CELL * state.mpc; }

  function renderHud() {
    var sel = selected(), parts = [];
    parts.push('<span>' + state.cols + '×' + state.rows + ' 칸</span>');
    parts.push('<span>1칸 <b>' + state.mpc + 'm</b></span>');
    parts.push('<span>' + Math.round(view.s * 100) + '%</span>');
    if (room.status === 'on') parts.push('<span>방 <b>' + room.code + '</b> · ' + room.members + '명</span>');
    else if (room.status === 'connecting') parts.push('<span>방 연결 중…</span>');
    else if (room.status === 'error') parts.push('<span>방 연결 끊김</span>');
    if (sel) {
      parts.push('<span>' + sel.label + ' <b>' + Math.round(((sel.a * 180 / Math.PI) % 360 + 360) % 360) + '°</b></span>');
      var sub = nearestSubject(sel);
      if (sub) parts.push('<span>배우까지 <b>' + meters(sub.d).toFixed(1) + 'm</b></span>');
    }
    $('hud').innerHTML = parts.join('');
  }
  function nearestSubject(it) {
    if (it.type !== 'camera' && it.type !== 'light' && it.type !== 'mic') return null;
    var L = items(), best = null;
    for (var i = 0; i < L.length; i++) {
      if (L[i].type !== 'actor') continue;
      var d = Math.hypot(L[i].x - it.x, L[i].y - it.y);
      if (!best || d < best.d) best = { d: d, it: L[i] };
    }
    return best;
  }

  /* ------------------------------------------------------------------ *
   *  화면 맞춤 / 줌
   * ------------------------------------------------------------------ */
  function resize() {
    var r = stage.getBoundingClientRect();
    cw = r.width; ch = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    board.width = Math.max(1, Math.round(cw * dpr));
    board.height = Math.max(1, Math.round(ch * dpr));
    if (autoFit) autoFitNow(); else draw();
  }
  function isCompact() { return cw > 0 && cw < 880; }   /* 모바일 레이아웃 기준과 같게 */
  var autoFit = true;
  function autoFitNow() { fit(isCompact() ? 36 : 0); }
  /* minCellPx: 한 칸이 화면에서 이보다 작아지지 않게 한다.
     좁은 화면에서 도면 전체를 다 넣으면 칸이 손가락보다 작아지기 때문이다. */
  function fit(minCellPx) {
    if (!cw || !ch) return;
    var pad = isCompact() ? 16 : 28;
    var s = Math.min((cw - pad * 2) / worldW(), (ch - pad * 2) / worldH());
    if (minCellPx) s = Math.max(s, minCellPx / CELL);
    view.s = Math.max(0.12, Math.min(4, s));
    view.tx = (cw - worldW() * view.s) / 2;
    view.ty = (ch - worldH() * view.s) / 2;
    draw();
  }
  function zoomAt(factor, sx, sy) {
    autoFit = false;
    var ns = Math.max(0.15, Math.min(5, view.s * factor));
    if (ns === view.s) return;
    view.tx = sx - (sx - view.tx) * (ns / view.s);
    view.ty = sy - (sy - view.ty) * (ns / view.s);
    view.s = ns;
    draw();
  }
  function toWorld(sx, sy) { return { x: (sx - view.tx) / view.s, y: (sy - view.ty) / view.s }; }
  function localPt(e) {
    var r = board.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  /* ------------------------------------------------------------------ *
   *  포인터 — 탭으로 배치, 끌어서 이동/회전/화면 이동, 두 손가락 확대
   * ------------------------------------------------------------------ */
  var pointers = {}, pcount = 0, mode = 'none', start = null, dragOff = null;
  var pinch = null, moved = false, willPlace = false;

  function hitTest(p) {
    var L = items(), r = Math.max(CELL * 0.5, 22 / view.s);
    for (var i = L.length - 1; i >= 0; i--) {
      if (Math.hypot(L[i].x - p.x, L[i].y - p.y) <= r) return L[i];
    }
    return null;
  }
  function overHandle(sel, screen) {
    if (!sel) return false;
    var hx = (sel.x + Math.cos(sel.a) * CELL * 0.95) * view.s + view.tx;
    var hy = (sel.y + Math.sin(sel.a) * CELL * 0.95) * view.s + view.ty;
    return Math.hypot(hx - screen.x, hy - screen.y) <= 24;

  }

  board.addEventListener('pointerdown', function (e) {
    board.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = localPt(e); pcount++;

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* 미리보기 창(아티팩트·iframe)에서는 브라우저가 링크 저장을 막는다.
     저장 기능을 내주는 호스트가 있으면 그쪽으로 넘기고,
     없으면 결과를 화면에 띄워 길게 누르기·복사로 가져가게 한다. */
  var dlCap = null, dlResolved = false;
  function withDownloads(cb) {
    if (dlResolved) { cb(dlCap); return; }
    if (!window.claude || typeof window.claude.use !== 'function') { dlResolved = true; cb(null); return; }
    var done = function (d) { dlCap = d || null; dlResolved = true; cb(dlCap); };
    try { window.claude.use('downloads').then(done, function () { done(null); }); }
    catch (e) { done(null); }
  }
  function deliver(name, blob, text) {
    if (!EMBEDDED) { download(blob, name); return; }
    withDownloads(function (d) {
      var fallback = function () { if (text != null) showText(text, name); else showImage(blob, name); };
      if (!d) { fallback(); return; }
      d.save({ filename: name, data: blob }).then(function () {
        toast(name + ' 저장을 요청했습니다.');
      }, function (err) {
        if (err && err.code === 'declined') return;
        fallback();
      });
    });
  }
  function showImage(blob, name) {
    var url = URL.createObjectURL(blob);
    var body = el('div', null, '');
    var img = document.createElement('img');
    img.src = url; img.alt = name;
    body.appendChild(img);
    body.appendChild(el('div', 'note', '이미지를 길게 누르거나 오른쪽 클릭해 저장하세요.'));
    overlay(name, body, null);
  }
  function showText(text, name) {
    var body = el('div', null, '');
    var ta = el('textarea');
    ta.value = text; ta.readOnly = true;
    body.appendChild(ta);
    body.appendChild(el('div', 'note', '전체를 복사해 .json 파일로 저장하면 다른 기기에서 그대로 불러올 수 있습니다.'));
    var foot = el('div', 'ovl-foot');
    var cp = el('button', 'btn primary', '전체 복사');
    cp.onclick = function () {
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (!ok && navigator.clipboard) { navigator.clipboard.writeText(text); ok = true; }
      cp.textContent = ok ? '복사됨' : '직접 선택해 복사하세요';
    };
    foot.appendChild(cp);
    overlay(name, body, foot);
  }
  function safeName(s) { return (s || 'plan').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60); }

  function exportPNG() {
    var W = worldW(), H = worldH();
    var pad = 48, head = 124, foot = 84, sc = 2;
    var cv = document.createElement('canvas');
    cv.width = (W + pad * 2) * sc;
    cv.height = (head + H + foot) * sc;
    var g = cv.getContext('2d');
    g.scale(sc, sc);
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, W + pad * 2, head + H + foot);

    var pal = { floor: '#ffffff', grid: '#ded9d0', major: '#b0aaa0', line: '#cfcabf', ink: '#17181c', muted: '#6f7480', accent: '#b46a12' };
    var sh = shot();

    g.fillStyle = pal.ink;
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = '700 27px "Noto Sans KR", sans-serif';
    g.fillText(state.project || 'ES Movie Club', pad, 46);
    g.font = '500 18px "Noto Sans KR", sans-serif';
    g.fillText(sh.name, pad, 74);
    if (sh.note) {
      g.fillStyle = pal.muted;
      g.font = '400 13px "Noto Sans KR", sans-serif';
      g.fillText(sh.note, pad, 96);
    }
    g.textAlign = 'right';
    g.fillStyle = pal.muted;
    g.font = '400 12px "Roboto Mono", monospace';
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    g.fillText(stamp, W + pad, 46);
    g.fillText('축척  1칸 = ' + state.mpc + 'm', W + pad, 66);
    g.fillText(state.cols + ' × ' + state.rows + ' 칸  ·  ' + (state.cols * state.mpc).toFixed(1) + ' × ' + (state.rows * state.mpc).toFixed(1) + 'm', W + pad, 86);
    g.strokeStyle = pal.line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(pad, head - 22); g.lineTo(W + pad, head - 22); g.stroke();

    g.save();
    g.translate(pad, head);
    paintScene(g, pal, { k: 1, items: sh.items, labels: true, ghost: false, coneAlpha: 0.85 });
    g.restore();

    /* 범례 */
    var counts = {}, order = [];
    sh.items.forEach(function (it) {
      if (!counts[it.type]) { counts[it.type] = 0; order.push(it.type); }
      counts[it.type]++;
    });
    var x = pad, y = head + H + 34;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    order.forEach(function (t) {
      var text = TYPES[t].ko + ' ' + counts[t];
      g.font = '500 13px "Noto Sans KR", sans-serif';
      var w = g.measureText(text).width + 40;
      if (x + w > W + pad) { x = pad; y += 30; }
      g.save();
      g.translate(x + 13, y);
      g.rotate(-Math.PI / 2);
      drawGlyph(g, t, 10);
      g.restore();
      g.fillStyle = pal.ink;
      g.fillText(text, x + 28, y + 1);
      x += w;
    });
    g.fillStyle = pal.muted;
    g.font = '400 11px "Roboto Mono", monospace';
    g.textAlign = 'right';
    g.fillText('촬영 배치도', W + pad, head + H + 34);

    cv.toBlob(function (blob) {
      if (!blob) { toast('이미지를 만들지 못했습니다.'); return; }
      deliver(safeName(state.project) + '_' + safeName(sh.name) + '.png', blob, null);
    }, 'image/png');
  }

  function exportJSON() {
    var text = JSON.stringify(state, null, 2);
    deliver(safeName(state.project) + '.json', new Blob([text], { type: 'application/json' }), text);
  }

  $('jsonFile').addEventListener('change', function (e) {

        if (!s || !Array.isArray(s.shots) || !s.shots.length) throw new Error('bad');

  $('bgFile').addEventListener('change', function (e) {

        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc);
        cv.height = Math.round(img.height * sc);
        var g = cv.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);

      img.onerror = function () { toast('이미지를 읽지 못했습니다.'); };

  /* ------------------------------------------------------------------ *
   *  방 — 여러 기기에서 같이 편집

   *  저장한다. 나중에 들어온 사람은 저장된 것을 받아서 시작한다.

  var room = { code: null, ch: null, client: null, members: 1, status: 'off', applying: false };
  var pendingRemote = null, pushTimer = null, dbTimer = null;

  var CLIENT_ID = (function () {
    try {
      var v = localStorage.getItem('filmset.client');
      if (v) return v;
      v = Math.random().toString(36).slice(2, 10);
      localStorage.setItem('filmset.client', v);
      return v;
    } catch (e) { return Math.random().toString(36).slice(2, 10); }
  })();

  var CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   /* 헷갈리는 I O 0 1 은 뺀다 */
  function makeCode() {
    var s = '';
    for (var i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];

  function roomConfigured() { return !!(SUPA_URL && SUPA_KEY); }
  function supa() {
    if (!roomConfigured() || !window.supabase) return null;

  function livePayload() {
    return { shots: state.shots, cols: state.cols, rows: state.rows, mpc: state.mpc, by: CLIENT_ID };
  }
  function fullPayload() {
    var p = livePayload();
    p.project = state.project; p.bg = state.bg; p.bgOpacity = state.bgOpacity;
    return p;
  }
  function applyPayload(p, withBg) {
    if (!p || !Array.isArray(p.shots) || !p.shots.length) return;
    room.applying = true;
    sanitize(p);
    state.shots = p.shots;
    if (p.cols) state.cols = p.cols;
    if (p.rows) state.rows = p.rows;
    if (p.mpc) state.mpc = p.mpc;
    if (withBg) {
      if (p.project) state.project = p.project;
      if (p.bg !== undefined) { state.bg = p.bg; state.bgOpacity = p.bgOpacity || 0.85; loadBg(); }
    }
    state.active = Math.max(0, Math.min(state.active, state.shots.length - 1));
    if (!findItem(selId)) selId = null;
    renderTabs(); renderPanel(); draw(); save();
    room.applying = false;
  }
  function receiveLive(p) {
    if (!p || p.by === CLIENT_ID) return;
    /* 내가 지금 끌고 있는 중이면 놓을 때까지 미뤄 둔다 */
    if (mode === 'move' || mode === 'rotate' || mode === 'pre-move') { pendingRemote = p; return; }
    applyPayload(p, false);
  }
  function flushRemote() {
    if (pendingRemote) { applyPayload(pendingRemote, false); pendingRemote = null; }
  }

  function roomPush() {
    if (!room.ch || room.applying) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      if (!room.ch) return;
      try { room.ch.send({ type: 'broadcast', event: 'plan', payload: livePayload() }); } catch (e) {}
    }, 180);
    clearTimeout(dbTimer);
    dbTimer = setTimeout(roomSaveDb, 2000);
  }
  function roomSaveDb() {
    var c = supa();
    if (!c || !room.code) return;
    c.from('rooms').upsert({ code: room.code, data: fullPayload(), updated_at: new Date().toISOString() })
      .then(function (r) { if (r && r.error) toast('방에 저장하지 못했어요: ' + r.error.message); });
  }
  function roomLoadDb(code, onMissing) {
    var c = supa();
    if (!c) return;
    c.from('rooms').select('data').eq('code', code).maybeSingle().then(function (r) {
      if (r.error) { toast('방을 불러오지 못했어요: ' + r.error.message); return; }
      if (!r.data) { if (onMissing) onMissing(); return; }
      applyPayload(r.data.data, true);
      toast('방 ' + code + ' 의 배치도를 불러왔어요.');
    });
  }

  function roomJoin(code, isNew) {
    var c = supa();
    if (!c) { toast('방 기능이 아직 설정되지 않았어요.'); return; }
    roomLeave(true);
    room.code = code; room.status = 'connecting'; renderRoomBtn();
    room.ch = c.channel('plan:' + code, {
      config: { broadcast: { self: false }, presence: { key: CLIENT_ID } }
    });
    room.ch.on('broadcast', { event: 'plan' }, function (m) { receiveLive(m.payload); });
    room.ch.on('presence', { event: 'sync' }, function () {
      var st = room.ch.presenceState() || {};
      room.members = Math.max(1, Object.keys(st).length);
      renderRoomBtn(); renderHud();
    });
    room.ch.subscribe(function (st) {
      if (st === 'SUBSCRIBED') {
        room.status = 'on';
        try { room.ch.track({ at: Date.now() }); } catch (e) {}
        try { localStorage.setItem(ROOM_KEY, code); } catch (e) {}
        renderRoomBtn(); renderHud();
        if (isNew) roomSaveDb();
        else roomLoadDb(code, function () { toast('그 코드의 방이 없어요. 새 방으로 시작합니다.'); roomSaveDb(); });
      } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
        if (room.status !== 'off') { room.status = 'error'; renderRoomBtn(); }
      }
    });
  }
  function roomLeave(quiet) {
    clearTimeout(pushTimer); clearTimeout(dbTimer);
    if (room.ch) { try { room.ch.unsubscribe(); } catch (e) {} }
    room.ch = null; room.code = null; room.status = 'off'; room.members = 1; pendingRemote = null;
    try { localStorage.removeItem(ROOM_KEY); } catch (e) {}

  }

  /* ------------------------------------------------------------------ *
   *  키보드
   * ------------------------------------------------------------------ */
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var key = e.key.toLowerCase();

    if ((e.metaKey || e.ctrlKey) && key === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if (key === 'escape') { selId = null; measure = null; renderPanel(); draw(); return; }
    if (key === 'v') return setTool('select');
    if (key === 'e') return setTool('erase');
    if (key === 'm') return setTool('measure');
    if (key === 'f') { autoFit = true; autoFitNow(); return; }
    if (key >= '1' && key <= '9') {
      var idx = parseInt(key, 10) - 1;
      if (ORDER[idx]) setTool(ORDER[idx]);
      return;
    }
    var sel = selected();
    if (!sel) return;
    if (key === 'delete' || key === 'backspace') {
      e.preventDefault(); pushUndo(); removeItem(sel.id); renderTabs(); return;
    }
    if (key === '[' || key === ']') {
      pushUndo();
      sel.a += (key === '[' ? -15 : 15) * Math.PI / 180;
      renderRotReadout(); draw(); save();
      return;
    }
    var step = e.shiftKey ? CELL : CELL / 4;
    var dx = 0, dy = 0;
    if (key === 'arrowleft') dx = -step;
    else if (key === 'arrowright') dx = step;
    else if (key === 'arrowup') dy = -step;
    else if (key === 'arrowdown') dy = step;
    else return;
    e.preventDefault(); pushUndo();
    sel.x = Math.max(0, Math.min(worldW(), sel.x + dx));
    sel.y = Math.max(0, Math.min(worldH(), sel.y + dy));
    draw(); save();
  });

  window.addEventListener('resize', resize);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', draw);
  }
  renderRoomBtn();
  if (roomConfigured()) {
    var savedRoom = null;
    try { savedRoom = localStorage.getItem(ROOM_KEY); } catch (e) {}
    if (savedRoom) roomJoin(savedRoom, false);
  }

  resize();
  autoFitNow();
  /* 글꼴이 늦게 도착하면 줄 높이가 달라져 화면 높이가 바뀐다. 그때 한 번 더 맞춘다. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { resize(); });
  }
})();
</script>
</body>
</html>
